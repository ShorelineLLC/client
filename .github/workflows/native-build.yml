name: Native Build

on:
  workflow_dispatch:

jobs:
  build-windows:
    name: windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v3

      - name: Install Toolchain
        uses: actions-rs/toolchain@v1
        with:
          toolchain: stable

      - name: Build DLL
        run: cargo build --release
        working-directory: src/main/rust

      - name: Pack Library
        run: src/main/rust/upx.exe src/main/rust/target/release/*.dll --best --lzma

      - name: Upload DLL
        uses: actions/upload-artifact@v4
        with:
          name: shoreline-loader.dll
          path: src/main/rust/target/release/*.dll

  build-linux:
    name: linux
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Install Toolchain
        uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
        
      - name: Install Linux System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libglib2.0-dev \
            pkg-config \
            libgtk-3-dev \
            libpango1.0-dev \
            libcairo2-dev \
            libgdk-pixbuf2.0-dev \
            libatk1.0-dev \
            libgdk3.0-cil-dev \
            libx11-dev \
            libxtst-dev \
            libxrender-dev \
            libxcb1-dev \
            libxcomposite-dev \
            libxdamage-dev \
            libxrandr-dev \
            libxi-dev \
            libxinerama-dev \
            libxcursor-dev \
            libxext-dev

      - name: Compile SO
        run: cargo build --release
        working-directory: src/main/rust

      - name: Pack Library
        run: strip src/main/rust/target/release/*.so

      - name: Upload SO
        uses: actions/upload-artifact@v4
        with:
          name: shoreline-loader.so
          path: src/main/rust/target/release/*.so

  build-macos:
    name: mac
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v3

      - name: Install Toolchain
        uses: actions-rs/toolchain@v1
        with:
          toolchain: stable

      - name: Build DYLIB
        run: cargo build --release
        working-directory: src/main/rust

      - name: Pack Library
        run: strip -x src/main/rust/target/release/*.dylib

      - name: Upload DYLIB
        uses: actions/upload-artifact@v4
        with:
          name: shoreline-loader.dylib
          path: src/main/rust/target/release/*.dylib