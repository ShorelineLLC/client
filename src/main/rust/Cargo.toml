[package]
name = "shoreline-loader"
version = "0.1.0"
edition = "2021"

[dependencies]
jni = "0.17.0"
obfstr = "0.4.3"
hardware-id = "0.3.0"
sha2 = "0.10.8"
hex = "0.4.3"
fltk = { version = "1.1", features = ["fltk-bundled"] }
serde_json = "1.0.117"
reqwest = { version = "0.12.4", features = ["blocking", "cookies"] }
zip = "2.1.3"
tokio = { version = "1", features = ["full"] }
lazy_static = "1.4.0"

[target.'cfg(target_os = "windows")'.dependencies]
winapi = { version = "0.3.9", default-features = false, features = ["debugapi"] }

[lib]
crate_type = ["cdylib"]